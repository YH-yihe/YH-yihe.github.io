<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 / 注册示例</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .card {
    width: 360px; background: #fff; border-radius: 16px;
    padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  h2 { margin: 0 0 20px; text-align: center; color: #333; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  input:focus { border-color: #667eea; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #667eea; color: #fff; font-size: 15px;
    cursor: pointer; transition: opacity .2s;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .switch { text-align: center; margin-top: 16px; font-size: 14px; color: #666; }
  .switch a { color: #667eea; cursor: pointer; text-decoration: none; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; text-align: center; }
  .msg.error { color: #e53e3e; }
  .msg.success { color: #38a169; }
  .hidden { display: none; }
  .info { font-size: 14px; color: #444; line-height: 1.9; }
  .info span { font-weight: 600; color: #667eea; }
  
  /* 新增：修改密码区域的样式 */
  .divider { margin: 20px 0; border-top: 1px solid #eee; }
  .sub-title { font-size: 14px; color: #333; margin-bottom: 10px; font-weight: 600;}
</style>
<link rel="icon" href="https://cabgmnpvdbqbahubdusk.supabase.co/storage/v1/object/sign/img/128.png?token=eyJraWQiOiI1NjliOGE1Mi00ODEwLTQyMzctYTg1Yy05Njg5ZDRhNjA4OWIiLCJhbGciOiJFUzI1NiJ9.eyJ1cmwiOiJpbWcvMTI4LnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTQzOTA0MTMsImV4cCI6MjEwOTc1MDQxM30.RCS3psy2bzRl8vWh_OKm0WhCvL7noGPEGJ3_SjRzwMo9lgHq_Jfb7QTn2nYqdm67Zm5_kgiWL69HKql652GhXg" type="image/x-icon">
</head>
<body>

<!-- 登录 / 注册卡片 -->
<div class="card" id="authCard">
  <h2 id="formTitle">登录</h2>
  <form id="authForm">
    <input id="identifier" type="text" placeholder="邮箱 或 用户名" required />
    <input id="username" type="text" placeholder="用户名（仅注册时填写）" class="hidden" />
    <input id="password" type="password" placeholder="密码（至少 6 位）" required minlength="6" />
    <button id="submitBtn" type="submit">登录</button>
  </form>
  <div class="switch">
    <span id="switchText">还没有账号？</span>
    <a id="switchLink">去注册</a>
  </div>
  <div class="msg" id="msg"></div>
</div>

<!-- 登录后的面板 -->
<div class="card hidden" id="dashboard">
  <h2>欢迎回来 🎉</h2>
  <div class="info">
    邮箱：<span id="userEmail"></span><br />
    用户名：<span id="userName">加载中…</span><br />
    用户 ID：<span id="userId" style="font-size:12px;word-break:break-all"></span>
  </div>
  
  <div class="divider"></div>
  
  <!-- 修改密码区域 -->
  <div class="sub-title">修改密码</div>
  <form id="pwdForm">
    <input id="newPassword" type="password" placeholder="输入新密码（至少 6 位）" required minlength="6" />
    <button id="updatePwdBtn" type="submit" style="background:#38a169">确认修改</button>
  </form>
  <div class="msg" id="pwdMsg"></div>

  <div class="divider"></div>
  
  <button id="logoutBtn" style="background:#e53e3e">退出登录</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://cabgmnpvdbqbahubdusk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4_YtNPgv7q_hP9RUBz0zUg_QCzoLH7D';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// DOM 元素获取
const authCard   = document.getElementById('authCard');
const dashboard  = document.getElementById('dashboard');
const formTitle  = document.getElementById('formTitle');
const authForm   = document.getElementById('authForm');
const identifierInput = document.getElementById('identifier');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const submitBtn  = document.getElementById('submitBtn');
const switchLink = document.getElementById('switchLink');
const switchText = document.getElementById('switchText');
const msgEl      = document.getElementById('msg');
const logoutBtn  = document.getElementById('logoutBtn');
const pwdForm = document.getElementById('pwdForm');
const newPasswordInput = document.getElementById('newPassword');
const updatePwdBtn = document.getElementById('updatePwdBtn');
const pwdMsgEl = document.getElementById('pwdMsg');

let isLoginMode = true;

// 🛡️ 前端防御：防止超长字符撑爆数据库
identifierInput.maxLength = 50;
passwordInput.maxLength = 50;
newPasswordInput.maxLength = 50;
usernameInput.maxLength = 20;

function setMode(login) {
  isLoginMode = login;
  formTitle.textContent = login ? '登录' : '注册';
  submitBtn.textContent = login ? '登录' : '注册';
  switchText.textContent = login ? '还没有账号？' : '已有账号？';
  switchLink.textContent = login ? '去注册' : '去登录';
  usernameInput.classList.toggle('hidden', login);
  
  if (login) {
    identifierInput.type = 'text';
    identifierInput.placeholder = '邮箱 或 用户名';
  } else {
    identifierInput.type = 'email';
    identifierInput.placeholder = '邮箱';
  }
  showMsg('', '');
}

switchLink.addEventListener('click', () => setMode(!isLoginMode));

function showMsg(text, type, isPwd = false) {
  const el = isPwd ? pwdMsgEl : msgEl;
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

function setLoading(loading, isPwd = false) {
  const btn = isPwd ? updatePwdBtn : submitBtn;
  btn.disabled = loading;
  if (isPwd) {
    btn.textContent = loading ? '修改中…' : '确认修改';
  } else {
    btn.textContent = loading ? '处理中…' : (isLoginMode ? '登录' : '注册');
  }
}

// 🛡️ 前端防御：本地频率限制（5秒冷却）
function checkCooldown() {
  const lastReq = localStorage.getItem('last_auth_request');
  const now = Date.now();
  if (lastReq && now - lastReq < 5000) { // 5000毫秒 = 5秒
    const wait = Math.ceil((5000 - (now - lastReq)) / 1000);
    throw new Error(`请求过于频繁，请等待 ${wait} 秒后再试。`);
  }
  localStorage.setItem('last_auth_request', now);
}

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  showMsg('', '');
  
  // 防后端资源耗尽：检查是否在后台偷偷刷
  if (document.hidden) return;

  try {
    checkCooldown(); // 触发冷却检查
    
    const identifier = identifierInput.value.trim();
    const password = passwordInput.value;
    const username = usernameInput.value.trim();

    // 🛡️ 前端防御：基本格式校验
    if (!identifier || !password) throw new Error('请填写完整信息');
    if (!isLoginMode && !/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
      throw new Error('用户名只能包含字母、数字和下划线，长度3-20');
    }
    if (!isLoginMode && password.length < 6) throw new Error('密码至少6位');
    
    setLoading(true);

    if (isLoginMode) {
      let loginEmail = identifier;
      if (!identifier.includes('@')) {
        // 改为调用安全的 RPC 函数查询邮箱
        const { data: foundEmail, error } = await supabase
          .rpc('get_email_by_username', { input_username: identifier });
        
        // 模糊报错，防止攻击者探测用户名是否存在
        if (error || !foundEmail) throw new Error('用户名或密码错误');
        loginEmail = foundEmail;
      }

      const { error } = await supabase.auth.signInWithPassword({ email: loginEmail, password });
      if (error) throw new Error('用户名或密码错误'); // 统一报错

    } else {
      const { data, error } = await supabase.auth.signUp({
        email: identifier,
        password,
        options: { data: { username: username || identifier.split('@')[0] } }
      });
      if (error) throw error;

      if (!data.session) {
        showMsg('注册成功！请到邮箱点击确认链接后再登录。', 'success');
        setMode(true);
        return;
      }
    }
  } catch (err) {
    showMsg(err.message || '出错了，请重试', 'error');
    // 如果发生了错误，退还冷却时间，允许用户修改后立刻重试
    if (!err.message.includes('请求过于频繁')) {
      localStorage.removeItem('last_auth_request');
    }
  } finally {
    setLoading(false);
  }
});

// 修改密码逻辑（同样 5 秒冷却防护）
pwdForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  showMsg('', '', true);
  try {
    checkCooldown();
    setLoading(true, true);

    const newPassword = newPasswordInput.value;
    if (newPassword.length < 6) throw new Error('密码至少6位');

    const { error } = await supabase.auth.updateUser({ password: newPassword });
    if (error) throw error;
    
    showMsg('密码修改成功！', 'success', true);
    newPasswordInput.value = '';
  } catch (err) {
    showMsg(err.message || '修改失败', 'error', true);
    if (!err.message.includes('请求过于频繁')) {
      localStorage.removeItem('last_auth_request');
    }
  } finally {
    setLoading(false, true);
  }
});

logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
});

async function loadProfile(user) {
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('userId').textContent = user.id;

  const { data, error } = await supabase
    .from('profiles')
    .select('username')
    .eq('id', user.id)
    .single();

  document.getElementById('userName').textContent =
    error ? '（读取失败）' : (data?.username || '（未设置）');
}

function renderSession(session) {
  if (session?.user) {
    authCard.classList.add('hidden');
    dashboard.classList.remove('hidden');
    passwordInput.value = '';
    newPasswordInput.value = '';
    pwdMsgEl.textContent = '';
    loadProfile(session.user);
  } else {
    dashboard.classList.add('hidden');
    authCard.classList.remove('hidden');
    document.getElementById('userName').textContent = '加载中…';
  }
}

supabase.auth.getSession().then(({ data }) => renderSession(data.session));
supabase.auth.onAuthStateChange((_event, session) => {
  renderSession(session);
});
</script>
</body>
</html>
