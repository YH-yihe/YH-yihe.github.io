<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YiHe 官方网站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #4f46e5; }
    .chat-window { display: none; }
    .chat-window.active { display: flex; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white font-sans antialiased h-screen flex flex-col overflow-hidden transition-colors duration-300">

  <header class="flex justify-between items-center p-6 border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md z-10 sticky top-0 shrink-0 shadow-sm transition-colors duration-300">
    <div class="text-2xl font-bold bg-gradient-to-r from-blue-500 to-indigo-600 bg-clip-text text-transparent cursor-pointer" onclick="window.location.href='index.html'">YiHe.</div>
    <div class="hidden md:flex gap-6 items-center">
      <a href="index.html" class="text-gray-900 dark:text-white font-medium">首页</a>
      <a href="download.html" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">软件下载</a>
      <a href="user.html" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">用户中心</a>
    </div>

    <div class="flex items-center gap-4">
      <button id="themeToggle" class="p-2 rounded-full bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
        <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <svg id="moonIcon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>

      <div id="navAuth">
        <!-- 🌟 直接跳转登录页 -->
        <a href="login.html" class="px-5 py-2 rounded-full bg-indigo-600 text-white hover:bg-indigo-700 transition text-sm font-medium shadow-md shadow-indigo-600/20">登录</a>
      </div>
      <div id="navUser" class="hidden flex items-center gap-4">
        <a href="user.html" class="text-sm text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition flex items-center gap-2" title="进入用户中心">
          欢迎, <span id="displayUsername" class="text-indigo-600 dark:text-indigo-400 font-bold underline decoration-indigo-300 dark:decoration-indigo-500/30">加载中...</span>
        </a>
        <button id="logoutBtn" class="text-sm text-gray-500 dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition">退出</button>
      </div>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-6 flex flex-col items-center justify-center">
    <section class="text-center py-20 max-w-2xl">
      <h1 class="text-5xl font-extrabold mb-6 leading-tight text-gray-900 dark:text-white">探索 <span class="text-indigo-600 dark:text-indigo-400">YiHe</span> 的极致体验</h1>
      <p class="text-gray-500 dark:text-gray-400 text-lg mb-10">这里提供最优质的资源下载与社区交流。加入我们，开启全新的数字旅程。</p>
      <a href="download.html" class="inline-block px-8 py-3 rounded-full bg-indigo-600 text-white hover:bg-indigo-700 transition font-medium text-lg shadow-lg shadow-indigo-600/30">前往下载中心</a>
    </section>
  </main>

  <!-- 聊天室悬浮按钮 -->
  <div id="chatToggle" class="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center cursor-pointer shadow-lg shadow-indigo-600/40 hover:bg-indigo-700 transition z-40 hidden">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
  </div>

  <div id="chatWindow" class="chat-window fixed bottom-24 right-6 w-80 h-96 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl flex-col shadow-2xl z-40 overflow-hidden transition-colors duration-300">
    <div class="bg-indigo-600 p-4 flex justify-between items-center text-white shrink-0">
      <span class="font-bold">💬 实时交流大厅</span>
      <button id="closeChat" class="hover:text-gray-200">✕</button>
    </div>
    <div class="bg-amber-50 dark:bg-amber-500/10 border-b border-amber-100 dark:border-amber-500/20 px-3 py-2 flex items-start gap-2 shrink-0">
      <span class="text-amber-500 text-xs mt-0.5">⚠️</span>
      <p class="text-xs text-amber-700 dark:text-amber-400 leading-tight">系统每天自动清理 3 天前的历史消息，请及时备份。</p>
    </div>
    <div id="chatMessages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3 bg-gray-50 dark:bg-gray-900 transition-colors duration-300"></div>
    <form id="chatForm" class="p-3 border-t border-gray-200 dark:border-gray-700 flex gap-2 shrink-0 bg-white dark:bg-gray-800">
      <input id="chatInput" type="text" placeholder="输入消息..." class="flex-1 bg-gray-100 dark:bg-gray-900 border border-transparent dark:border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:bg-white dark:focus:bg-gray-800 focus:border-indigo-500 transition" required autocomplete="off" />
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">发送</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://cabgmnpvdbqbahubdusk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4_YtNPgv7q_hP9RUBz0zUg_QCzoLH7D';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('themeToggle').onclick = () => {
      const html = document.documentElement;
      if (html.classList.contains('dark')) { html.classList.remove('dark'); localStorage.setItem('theme', 'light'); } 
      else { html.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
    };

    let currentUser = null;
    const chatToggle = document.getElementById('chatToggle');
    const chatWindow = document.getElementById('chatWindow');
    const closeChat = document.getElementById('closeChat');
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');

    document.getElementById('logoutBtn').onclick = () => supabase.auth.signOut();
    chatToggle.onclick = () => chatWindow.classList.add('active');
    closeChat.onclick = () => chatWindow.classList.remove('active');

    function appendMessage(msg) {
      const isMe = currentUser && msg.user_id === currentUser.id;
      const div = document.createElement('div');
      div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      const nameSpan = document.createElement('span');
      nameSpan.className = 'text-xs text-gray-500 dark:text-gray-400 mb-1';
      nameSpan.textContent = isMe ? '我' : (msg.username || '匿名');
      
      const msgBubble = document.createElement('div');
      msgBubble.className = `max-w-[80%] p-3 rounded-xl text-sm break-all ${
        isMe ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 border border-gray-100 dark:border-gray-700 rounded-tl-none shadow-sm'
      }`;
      msgBubble.textContent = msg.content;
      
      div.appendChild(nameSpan); div.appendChild(msgBubble);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const content = chatInput.value.trim();
      if (!content || !currentUser) return;
      chatInput.value = ''; 
      await supabase.from('messages').insert({ content, user_id: currentUser.id, username: document.getElementById('displayUsername').textContent });
    };

    supabase.auth.onAuthStateChange(async (event, session) => {
      currentUser = session?.user || null;
      if (currentUser) {
        document.getElementById('navAuth').classList.add('hidden');
        document.getElementById('navUser').classList.remove('hidden');
        const { data: profile } = await supabase.from('profiles').select('username').eq('id', currentUser.id).single();
        document.getElementById('displayUsername').textContent = profile?.username || '用户';
        chatToggle.classList.remove('hidden');
        chatMessages.innerHTML = '';
        supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50).then(({ data }) => {
          if (data) data.forEach(appendMessage);
        });
      } else {
        document.getElementById('navAuth').classList.remove('hidden');
        document.getElementById('navUser').classList.add('hidden');
        chatToggle.classList.add('hidden');
        chatWindow.classList.remove('active');
        chatMessages.innerHTML = '';
      }
    });

    supabase.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      if (currentUser) appendMessage(payload.new);
    }).subscribe();
  </script>
</body>
</html>
