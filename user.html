<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户中心 - YiHe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    .tab-btn { color: #6b7280; border-bottom: 2px solid transparent; transition: all 0.3s; }
    .dark .tab-btn { color: #9ca3af; }
    .tab-btn.active { color: #111827; border-color: #6366f1; }
    .dark .tab-btn.active { color: #fff; border-color: #6366f1; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">

  <header class="flex justify-between items-center p-6 border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shrink-0 sticky top-0 z-10 shadow-sm transition-colors duration-300">
    <div class="text-2xl font-bold bg-gradient-to-r from-blue-500 to-indigo-600 bg-clip-text text-transparent cursor-pointer" onclick="window.location.href='index.html'">YiHe.</div>
    <div class="hidden md:flex gap-6 items-center">
      <a href="index.html" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">首页</a>
      <a href="download.html" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">软件下载</a>
      <a href="user.html" class="text-gray-900 dark:text-white font-medium">用户中心</a>
    </div>
    <div class="flex items-center gap-4">
      <button id="themeToggle" class="p-2 rounded-full bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
        <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <svg id="moonIcon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>

      <div id="navAuth" class="hidden">
        <a href="login.html" class="px-5 py-2 rounded-full bg-indigo-600 text-white hover:bg-indigo-700 transition text-sm font-medium shadow-md">登录</a>
      </div>
      <div id="navUser" class="hidden flex items-center gap-4">
        <span class="text-sm text-gray-600 dark:text-gray-300">欢迎, <span id="displayUsername" class="text-indigo-600 dark:text-indigo-400 font-bold">加载中...</span></span>
        <button id="logoutBtn" class="text-sm text-gray-500 dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition">退出</button>
      </div>
    </div>
  </header>

  <main class="flex-1 p-6 flex flex-col items-center justify-center">
    
    <!-- 🌟 加载状态遮罩 -->
    <div id="loadingState" class="text-center py-20 flex flex-col items-center">
      <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-indigo-600 dark:text-indigo-400 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <p class="text-gray-500 dark:text-gray-400">正在验证登录状态...</p>
    </div>

    <!-- 未登录提示 -->
    <div id="notLoggedIn" class="text-center py-20 hidden">
      <h2 class="text-2xl font-bold mb-4">您还没有登录</h2>
      <a href="login.html" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition inline-block shadow-md">去登录</a>
    </div>

    <!-- 用户中心主体 -->
    <div id="userCenter" class="w-full max-w-5xl py-8 hidden">
      <div class="flex justify-center gap-8 mb-8 border-b border-gray-200 dark:border-gray-800">
        <button class="tab-btn active pb-3 px-2 font-medium" onclick="switchTab('tab-profile')">个人设置</button>
        <button id="tabBtn-manage" class="tab-btn hidden pb-3 px-2 font-medium" onclick="switchTab('tab-manage')">用户管理</button>
        <button id="tabBtn-upload" class="tab-btn hidden pb-3 px-2 font-medium" onclick="switchTab('tab-upload')">文件上传</button>
      </div>

      <div id="tab-profile" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-xl overflow-hidden relative transition-colors duration-300">
          <div class="h-24 bg-gradient-to-r from-indigo-500 to-purple-600"></div>
          <div class="p-8 relative">
            <div class="absolute -top-12 left-8 relative group">
              <img id="avatarImg" src="https://ui-avatars.com/api/?name=User&background=random&size=128" class="w-24 h-24 rounded-full border-4 border-white dark:border-gray-800 object-cover bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
              <label for="avatarInput" class="absolute bottom-0 right-0 bg-indigo-600 hover:bg-indigo-500 p-1.5 rounded-full cursor-pointer transition shadow-lg">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </label>
              <input type="file" id="avatarInput" accept="image/*" class="hidden">
            </div>
            <div class="flex justify-end mb-4">
              <span id="roleBadge" class="px-3 py-1 rounded-full text-xs font-bold border transition-colors duration-300">...</span>
            </div>
            <form id="profileForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">注册邮箱</label>
                <input type="text" id="profileEmail" readonly class="w-full bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-2 text-gray-500 dark:text-gray-400 cursor-not-allowed" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">昵称</label>
                <input type="text" id="profileUsername" required minlength="3" maxlength="20" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-2 text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500 transition" />
              </div>
              <div class="pt-2 flex justify-between items-center">
                <p id="profileMsg" class="text-sm font-medium"></p>
                <button type="submit" class="px-5 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg font-medium transition">保存昵称</button>
              </div>
            </form>
          </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-xl p-8 transition-colors duration-300">
          <h3 class="text-xl font-bold mb-6 text-indigo-600 dark:text-indigo-400">安全设置</h3>
          <form id="pwdForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-1">修改密码</label>
              <input type="password" id="newPassword" placeholder="新密码（至少6位）" required minlength="6" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500 transition" />
            </div>
            <div class="flex justify-between items-center pt-2">
              <p id="pwdMsg" class="text-sm font-medium"></p>
              <button type="submit" class="px-6 py-2.5 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg font-medium transition">更新密码</button>
            </div>
          </form>
        </div>
      </div>

      <div id="tab-manage" class="tab-content hidden">
        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-blue-200 dark:border-blue-500/30 overflow-hidden shadow-xl transition-colors duration-300">
          <div class="p-6 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h3 class="text-xl font-bold text-blue-600 dark:text-blue-400">⚙️ 全站用户管理</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-gray-50 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400">
                <tr>
                  <th class="px-6 py-4">用户</th>
                  <th class="px-6 py-4">邮箱</th>
                  <th class="px-6 py-4">角色</th>
                  <th class="px-6 py-4 text-right">操作</th>
                </tr>
              </thead>
              <tbody id="userTableBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="tab-upload" class="tab-content hidden space-y-8">
        <div id="superAdminUploadArea" class="hidden bg-white dark:bg-gray-800 p-6 rounded-2xl border border-purple-200 dark:border-purple-500/30 transition-colors duration-300 shadow-sm">
          <h3 class="text-lg font-bold mb-3 text-purple-600 dark:text-purple-400">👑 上传官方软件</h3>
          <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">官方文件将置顶显示在下载中心。</p>
          <div class="flex gap-4 items-center">
            <input type="file" id="officialFileInput" class="block w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-50 dark:file:bg-purple-600 file:text-purple-700 dark:file:text-white hover:file:bg-purple-100 dark:hover:file:bg-purple-500 transition cursor-pointer"/>
            <button id="uploadOfficialBtn" class="px-6 py-2 bg-purple-600 text-white hover:bg-purple-700 rounded-lg font-medium transition shrink-0 shadow-md">上传</button>
          </div>
          <p id="officialUploadMsg" class="text-sm mt-2"></p>
        </div>

        <div id="adminUploadArea" class="hidden bg-white dark:bg-gray-800 p-6 rounded-2xl border border-emerald-200 dark:border-emerald-500/30 transition-colors duration-300 shadow-sm">
          <h3 class="text-lg font-bold mb-3 text-emerald-600 dark:text-emerald-400">🛡️ 上传备份资源</h3>
          <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">备份文件将按时间排列在下载中心。</p>
          <div class="flex gap-4 items-center">
            <input type="file" id="backupFileInput" class="block w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 dark:file:bg-emerald-600 file:text-emerald-700 dark:file:text-white hover:file:bg-emerald-100 dark:hover:file:bg-emerald-500 transition cursor-pointer"/>
            <button id="uploadBackupBtn" class="px-6 py-2 bg-emerald-600 text-white hover:bg-emerald-700 rounded-lg font-medium transition shrink-0 shadow-md">上传</button>
          </div>
          <p id="backupUploadMsg" class="text-sm mt-2"></p>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL = 'https://cabgmnpvdbqbahubdusk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4_YtNPgv7q_hP9RUBz0zUg_QCzoLH7D';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const superAdminEmail = '3994685553@qq.com'; 
    let currentUser = null;
    let currentRole = 'user';

    document.getElementById('themeToggle').onclick = () => {
      const html = document.documentElement;
      if (html.classList.contains('dark')) { html.classList.remove('dark'); localStorage.setItem('theme', 'light'); } 
      else { html.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
    };

    window.switchTab = (tabId) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.remove('hidden');
      event.currentTarget.classList.add('active');
    };

    document.getElementById('logoutBtn').onclick = () => supabase.auth.signOut();

    document.getElementById('avatarInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;
      if (file.size > 2 * 1024 * 1024) return alert('头像不能超过2MB');
      const fileName = `${currentUser.id}/avatar-${Date.now()}.${file.name.split('.').pop()}`;
      const msgEl = document.getElementById('profileMsg');
      msgEl.textContent = '上传中...';
      
      const { error: uploadError } = await supabase.storage.from('avatars').upload(fileName, file);
      if (uploadError) { msgEl.textContent = '失败：' + uploadError.message; return; }
      
      const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(fileName);
      await supabase.from('profiles').update({ avatar_url: urlData.publicUrl }).eq('id', currentUser.id);
      document.getElementById('avatarImg').src = urlData.publicUrl;
      msgEl.textContent = '头像更新成功！';
    };

    document.getElementById('profileForm').onsubmit = async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      const newName = document.getElementById('profileUsername').value.trim();
      const msgEl = document.getElementById('profileMsg');
      msgEl.textContent = '保存中...';
      
      const { data: isTaken } = await supabase.rpc('is_username_taken', { input_username: newName });
      if (isTaken && newName !== document.getElementById('displayUsername').textContent) {
        msgEl.textContent = '该昵称已被他人使用'; return;
      }
      
      await supabase.from('profiles').update({ username: newName }).eq('id', currentUser.id);
      document.getElementById('displayUsername').textContent = newName;
      msgEl.textContent = '昵称修改成功！';
    };

    document.getElementById('pwdForm').onsubmit = async (e) => {
      e.preventDefault();
      const newPwd = document.getElementById('newPassword').value;
      const msgEl = document.getElementById('pwdMsg');
      msgEl.textContent = '更新中...';
      const { error } = await supabase.auth.updateUser({ password: newPwd });
      if (error) {
        msgEl.className = 'text-sm text-red-500';
        msgEl.textContent = '失败：' + error.message;
      } else {
        msgEl.className = 'text-sm text-green-600 dark:text-green-400';
        msgEl.textContent = '密码修改成功！';
        document.getElementById('newPassword').value = '';
      }
    };

    async function loadUserList() {
      const { data: users, error } = await supabase.from('profiles').select('*').order('updated_at', { ascending: false });
      if (error) return console.error(error);

      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';
      
      users.forEach(u => {
        let roleLabel = '普通用户';
        let roleClass = 'text-gray-500 dark:text-gray-400';
        if (u.role === 'super_admin') { roleLabel = '超级管理员'; roleClass = 'text-red-600 dark:text-red-400 font-bold'; }
        else if (u.role === 'admin') { roleLabel = '普通管理员'; roleClass = 'text-emerald-600 dark:text-emerald-400 font-bold'; }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="px-6 py-4 flex items-center gap-3">
            <img src="${u.avatar_url || `https://ui-avatars.com/api/?name=${u.username}&background=random`}" class="w-8 h-8 rounded-full object-cover border border-gray-200 dark:border-gray-600">
            <span class="font-medium">${u.username}</span>
          </td>
          <td class="px-6 py-4 text-gray-500 dark:text-gray-400">${u.email}</td>
          <td class="px-6 py-4 ${roleClass}">${roleLabel}</td>
          <td class="px-6 py-4 text-right space-x-2">
            ${u.role !== 'super_admin' ? `
              ${u.role === 'user' 
                ? `<button onclick="changeRole('${u.email}', 'admin')" class="px-3 py-1 bg-blue-50 dark:bg-blue-600/20 text-blue-600 dark:text-blue-400 hover:bg-blue-600 hover:text-white rounded text-xs transition">设为管理</button>`
                : `<button onclick="changeRole('${u.email}', 'user')" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-red-600 hover:text-white rounded text-xs transition">撤销管理</button>`
              }
            ` : '<span class="text-xs text-gray-400 dark:text-gray-500">不可操作</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.changeRole = async (email, newRole) => {
      if (!confirm(`确定要更改该用户的角色吗？`)) return;
      const { error } = await supabase.rpc('set_user_role', { target_email: email, new_role: newRole });
      if (error) alert('操作失败：' + error.message);
      else loadUserList();
    };

    document.getElementById('uploadOfficialBtn').onclick = async () => {
      const file = document.getElementById('officialFileInput').files[0];
      if (!file) return;
      const msg = document.getElementById('officialUploadMsg');
      msg.textContent = '上传中...';
      const { error } = await supabase.storage.from('official').upload(file.name, file);
      if (error) msg.textContent = '失败：' + error.message;
      else msg.textContent = '上传成功！';
    };

    document.getElementById('uploadBackupBtn').onclick = async () => {
      const file = document.getElementById('backupFileInput').files[0];
      if (!file) return;
      const msg = document.getElementById('backupUploadMsg');
      msg.textContent = '上传中...';
      const { error } = await supabase.storage.from('backup').upload(file.name, file);
      if (error) msg.textContent = '失败：' + error.message;
      else msg.textContent = '上传成功！';
    };

    // 🌟 核心修复：处理异步加载态
    supabase.auth.onAuthStateChange(async (event, session) => {
      currentUser = session?.user || null;
      
      // 隐藏加载圈
      document.getElementById('loadingState').classList.add('hidden');

      if (currentUser) {
        document.getElementById('navAuth').classList.add('hidden');
        document.getElementById('navUser').classList.remove('hidden');
        document.getElementById('notLoggedIn').classList.add('hidden');
        document.getElementById('userCenter').classList.remove('hidden');

        const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        currentRole = profile?.role || (currentUser.email === superAdminEmail ? 'super_admin' : 'user');
        
        document.getElementById('displayUsername').textContent = profile?.username || '用户';
        document.getElementById('profileUsername').value = profile?.username || '';
        document.getElementById('profileEmail').value = currentUser.email;
        document.getElementById('avatarImg').src = profile?.avatar_url || `https://ui-avatars.com/api/?name=${profile?.username || 'U'}&background=6366f1&color=fff`;

        const roleBadge = document.getElementById('roleBadge');
        if (currentRole === 'super_admin') { roleBadge.textContent = '超级管理员'; roleBadge.className = 'px-3 py-1 rounded-full text-xs font-bold border border-red-200 dark:border-red-500/30 bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400'; }
        else if (currentRole === 'admin') { roleBadge.textContent = '普通管理员'; roleBadge.className = 'px-3 py-1 rounded-full text-xs font-bold border border-emerald-200 dark:border-emerald-500/30 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400'; }
        else { roleBadge.textContent = '普通用户'; roleBadge.className = 'px-3 py-1 rounded-full text-xs font-bold border border-gray-200 dark:border-gray-500/30 bg-gray-50 dark:bg-gray-500/10 text-gray-600 dark:text-gray-400'; }

        document.getElementById('tabBtn-manage').classList.toggle('hidden', currentRole !== 'super_admin');
        document.getElementById('tabBtn-upload').classList.toggle('hidden', currentRole === 'user');
        document.getElementById('superAdminUploadArea').classList.toggle('hidden', currentRole !== 'super_admin');
        document.getElementById('adminUploadArea').classList.toggle('hidden', currentRole === 'user');

        if (currentRole === 'super_admin') loadUserList();

      } else {
        document.getElementById('navAuth').classList.remove('hidden');
        document.getElementById('navUser').classList.add('hidden');
        document.getElementById('notLoggedIn').classList.remove('hidden');
        document.getElementById('userCenter').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
